# Render Blueprint: Dashboard → New → Blueprint 에서 이 저장소를 고르면 서비스가 만들어진다.
# sync: false 항목은 처음 만들 때 Render 화면에서 직접 입력한다 (Git에 값을 넣지 않음).
services:
  - type: web
    name: twinsight
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: DATABASE_SCHEMA
        value: twinsight
      - key: DATABASE_AUTO_CREATE
        value: "false"
      - key: STREAM_TTL_MINUTES
        value: "30"
      # twinsight_app 역할의 연결 한도를 팀이 나눠 쓴다. 배포 중에는 새·이전 서버가 잠시 함께 뜬다.
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_APP_NAME
        value: twinsight-render
      - key: DATABASE_URL
        sync: false
      - key: TEAM_ACCESS_TOKEN
        sync: false
      - key: ITS_API_KEY
        sync: false
      - key: VITE_CARTO_KEY
        sync: false
